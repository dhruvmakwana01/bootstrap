<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Your Trip</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e74c3c;
            --light-gray: #f8f9fa;
            --medium-gray: #e9ecef;
            --dark-gray: #495057;
            --text-dark: #212529;
            --text-light: #6c757d;
            --white: #ffffff;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.08);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.12);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.16);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: var(--text-dark);
            background-color: var(--white);
        }

        /* Navbar Styles */
        .navbar {
            background: var(--white) !important;
            padding: 1rem 0;
            box-shadow: var(--shadow-sm);
            border-bottom: 1px solid var(--medium-gray);
        }

        .navbar-brand {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color) !important;
            transition: var(--transition);
        }

        .navbar-brand:hover {
            color: var(--secondary-color) !important;
        }

        .nav-link {
            color: var(--text-dark) !important;
            font-weight: 500;
            padding: 0.5rem 1rem !important;
            transition: var(--transition);
            border-radius: 6px;
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--secondary-color) !important;
            background: var(--light-gray);
        }

        .btn-warning {
            background: var(--secondary-color);
            border: none;
            padding: 0.6rem 1.5rem;
            font-weight: 600;
            transition: var(--transition);
            border-radius: 6px;
        }

        .btn-warning:hover {
            background: #2980b9;
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <i class="fa-solid fa-plane-departure me-2"></i> ChaloChale</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#destinations">Destinations</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#packages">Packages</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="booking.html">Booking</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#contact">Contact</a>
                    </li>
                </ul>
                <a href="login.html" class="btn btn-warning ms-lg-3">Login</a>
                <a href="signup.html" class="btn btn-warning ms-lg-3">Sign Up</a>
            </div>
        </div>
    </nav>

    <section class="py-5 bg-light text-center">
        <div class="container">
            <h1 class="fw-bold">Travel Booking Form</h1>
            <p class="lead">Fill the form and submit your travel request</p>
        </div>
    </section>

    <section class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="card shadow-lg p-4 rounded-4">
                        <h3 class="text-center fw-bold mb-4">Book Your Trip</h3>
                        <form>
                            <div class="row">
                                <div class="col-12 col-md-6 mb-3">
                                    <label class="form-label">First Name</label>
                                    <input type="text" class="form-control" id="firstnameInput"
                                        aria-describedby="firstnameHelp" placeholder="Enter your first name">
                                </div>
                                <div class="col-12 col-md-6 mb-3">
                                    <label class="form-label">Last Name</label>
                                    <input type="text" class="form-control" placeholder="Enter your last name">
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-12 col-md-6 mb-3">
                                    <label class="form-label">Email address</label>
                                    <input type="email" class="form-control" placeholder="Enter your email address">
                                </div>

                                <div class="col-12 col-md-6 mb-3">
                                    <label class="form-label">Select Destination</label>
                                    <select class="form-select" aria-label="Default select example">
                                        <option selected>Goa</option>
                                        <option value="1">Agra</option>
                                        <option value="2">Jaipur</option>
                                        <option value="2">Manali</option>
                                        <option value="2">Kerala</option>
                                    </select>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-12 col-md-6 mb-3">
                                    <label class="form-label">Travel Date</label>
                                    <input type="date" class="form-control">
                                </div>
                                <div class="col-12 col-md-6 mb-3">
                                    <label class="form-label">Number of People</label>
                                    <input type="number" class="form-control" placeholder="Enter number of people">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Message / Requirement</label>
                                <textarea class="form-control" rows="4"
                                    placeholder="Enter your travel requirements"></textarea>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Submit</button>
                    </div>


                </div>


                </form>
            </div>
        </div>
        </div>
        </div>
    </section>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
